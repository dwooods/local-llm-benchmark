# Coding assistant suite — maps to Project Instructions §5 "Coding assistant"
# Run: npx promptfoo@latest eval -c promptfoo-coding.yaml
# View: npx promptfoo@latest view

description: "PC coding-model shortlist vs the §5 coding suite"

# num_ctx is fixed at 4096 for every provider below, deliberately identical
# across models. Every test prompt here is short, so 4096 is ample headroom;
# keeping it uniform means context-window size can't be the hidden variable
# that makes one model's result look better/worse than another's, and it
# stays well clear of pushing deepseek-coder-v2:16b or qwen2.5-coder:14b into
# split-mode purely from an oversized KV cache (see Project Instructions §2).
providers:
  - id: ollama:chat:qwen2.5-coder:14b
    config:
      temperature: 0.2
      num_predict: 1024
      num_ctx: 4096
  - id: ollama:chat:qwen2.5-coder:7b
    config:
      temperature: 0.2
      num_predict: 1024
      num_ctx: 4096
  - id: ollama:chat:deepseek-coder-v2:16b
    config:
      temperature: 0.2
      num_predict: 1024
      num_ctx: 4096
  - id: ollama:chat:gemma4:12b
    config:
      temperature: 0.2
      num_predict: 1024
      num_ctx: 4096

# Fixed judge for llm-rubric grading — deliberately NOT one of the models under
# test above, to avoid a model grading its own output. deepseek-r1:14b is the
# project's "deep reasoning" model, not a coding-specialist, so it's a reasonably
# neutral judge here. Swap this if you'd rather use a cloud judge instead.
defaultTest:
  options:
    provider:
      id: ollama:chat:deepseek-r1:14b
      config:
        num_ctx: 4096

prompts:
  - "{{task}}"

tests:
  - vars:
      task: "Write a Python function `parse_duration(s: str) -> int` that converts a duration string like '1h30m', '45m', or '2h' into total seconds. No explanation, just the function."
    assert:
      - type: llm-rubric
        value: "The response contains a working Python function named parse_duration that correctly handles hour ('h') and minute ('m') suffixes and returns an integer number of seconds. Minor style differences are fine; incorrect logic or missing function is a fail."

  - vars:
      task: |
        This test is failing. Fix the bug and explain the one-line change.

        def average(nums):
            return sum(nums) / len(nums)

        # test_average.py
        def test_empty_list():
            assert average([]) == 0

        # AssertionError / ZeroDivisionError: division by zero
    assert:
      - type: llm-rubric
        value: "The response identifies the ZeroDivisionError on an empty list and fixes it (e.g. returning 0 when len(nums) == 0), and the explanation correctly describes the root cause."

  - vars:
      task: |
        Explain what this code does, then refactor it to be more readable, keeping behavior identical:

        def f(l):
            r=[]
            for i in l:
                if i%2==0:
                    r.append(i*i)
            return r
    assert:
      - type: llm-rubric
        value: "The explanation correctly says this squares the even numbers in a list. The refactor preserves that exact behavior (same inputs -> same outputs) while using clearer names and/or a list comprehension."

  - vars:
      task: |
        Add input validation to this function. You only have this one function — no other files are shown.

        def divide(a, b):
            return a / b
    assert:
      - type: llm-rubric
        value: "Score PASS if the model either (a) adds sensible validation (e.g. checks b != 0, raises a clear error) using only the info given, or (b) explicitly asks what error-handling convention the rest of the codebase uses before assuming one. Score FAIL if it silently invents project-wide conventions (custom exception classes, logging patterns, etc.) it has no way of knowing, without flagging the assumption — this test is checking for hallucinated context awareness, per the project's 'multi-file edit awareness' criterion."
