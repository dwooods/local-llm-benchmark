# Debug config — audits promptfoo-chat.yaml's two REAL llm-rubric tests
# (RAM-usage question, VRAM-cliff summarization) across all three chat
# providers, now that deepseek-r1:14b (the fixed judge here too) has one
# CONFIRMED false-negative grade on the coding suite (Sept 13 — see
# Benchmark Log). The chat suite's third rubric test is still just a
# placeholder (see promptfoo-chat.yaml) and isn't included here; the
# factual "what year" test uses contains-any, not the judge, so it's out
# of scope for this audit too — it has its own separate known issue
# (documented elsewhere) but not a judge-reliability one.
#
# Goal: capture the judge's full reasoning text for all 6 real
# test-provider combos (2 tests x 3 providers) and hand-check whether any
# PASS looks like it should have been a FAIL (the mirror-image risk of
# what was just found in coding — there, a correct answer got a false
# FAIL; here, check nothing incorrect got a false PASS).
#
# Run: npx promptfoo@latest eval -c promptfoo-chat-debug.yaml --output chat-debug-result.json
# Then open chat-debug-result.json and check each result's
# gradingResult.reason against the actual response.output text.

description: "DEBUG: audit chat-suite judge reliability (RAM-usage + summarization tests)"

providers:
  - id: ollama:chat:qwen3.5:9b
    config:
      temperature: 0.5
      num_ctx: 4096
  - id: ollama:chat:phi4:14b
    config:
      temperature: 0.5
      num_ctx: 4096
  - id: ollama:chat:gpt-oss:20b
    config:
      temperature: 0.5
      num_ctx: 4096

# Same fixed judge as the full chat suite, so any PASS/FAIL call here is
# directly comparable to the Sept 12 run.
defaultTest:
  options:
    provider:
      id: ollama:chat:deepseek-r1:14b
      config:
        num_ctx: 4096

prompts:
  - "{{input}}"

tests:
  - vars:
      input: "How much usable RAM does an 8GB Raspberry Pi 5 actually expose to the OS, roughly?"
    assert:
      - type: llm-rubric
        value: "Answer is in the ballpark of 7.7-8GB (the actual measured figure in this project is 7.87GB) — a wildly different number is a fail."

  - vars:
      input: |
        Summarize the following in 2 sentences:

        The 12GB VRAM cliff on this rig means models that fit fully in the RX 6700 XT's
        VRAM run at native bandwidth and are dramatically faster than CPU-only inference —
        qwen2.5:3b hit 138.94 tok/s versus a 6.88 tok/s CPU baseline. Once a model's
        footprint exceeds roughly 11.2GB, Ollama splits layers across the PCIe bus into
        system RAM, and this isn't simply slower — it can be worse than CPU-only entirely.
        gemma4:31b in split mode measured about 5.5 tok/s, actually slower than the plain
        CPU baseline for a smaller model, while gpt-oss:20b in split mode still beat the
        CPU baseline at 11.28 tok/s. The practical rule is to treat ~13B params at Q4_K_M
        as the comfortable, reliably fast ceiling, and to test anything above that
        individually rather than assuming split-mode performance either way.
    assert:
      - type: llm-rubric
        value: "The 2-sentence summary correctly conveys that (1) models fitting in VRAM are much faster, and (2) exceeding the VRAM budget triggers unpredictable split-mode performance that can be worse than CPU-only, not just slower. Missing either point, or claiming split-mode is always bad/always fine, is a fail."
