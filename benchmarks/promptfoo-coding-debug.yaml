# Debug config — isolates the ONE failing test/provider combo from
# promptfoo-coding.yaml (Sept 13 run) so the full generated code prints
# without the full-suite terminal table truncating it.
#
# Failing combo: qwen2.5-coder:14b on the parse_duration test.
# Everything else (provider settings, judge, assertion) is copied verbatim
# from promptfoo-coding.yaml — only the provider list and test list are
# trimmed to this one pair. Delete this file once the bug is diagnosed;
# it's not meant to be a permanent addition to the four-suite set.
#
# Run: npx promptfoo@latest eval -c promptfoo-coding-debug.yaml
# View: npx promptfoo@latest view   (or just read the terminal output —
# with only one test case, the full code should print without truncation)

description: "DEBUG: isolate qwen2.5-coder:14b parse_duration failure"

providers:
  - id: ollama:chat:qwen2.5-coder:14b
    config:
      temperature: 0.2
      num_predict: 1024
      num_ctx: 4096

# Same fixed judge as the full coding suite, so the PASS/FAIL call is
# directly comparable to the Sept 13 run rather than graded differently.
defaultTest:
  options:
    provider:
      id: ollama:chat:deepseek-r1:14b
      config:
        num_ctx: 4096

prompts:
  - "{{task}}"

tests:
  - vars:
      task: "Write a Python function `parse_duration(s: str) -> int` that converts a duration string like '1h30m', '45m', or '2h' into total seconds. No explanation, just the function."
    assert:
      - type: llm-rubric
        value: "The response contains a working Python function named parse_duration that correctly handles hour ('h') and minute ('m') suffixes and returns an integer number of seconds. Minor style differences are fine; incorrect logic or missing function is a fail."
