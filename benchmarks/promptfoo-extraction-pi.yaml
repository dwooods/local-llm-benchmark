# Structured/data extraction suite — Raspberry Pi 5 shortlist variant
# Derived from promptfoo-extraction.yaml (PC version) — only the `providers:`
# block is changed, to the six Pi shortlist models. Every prompt, test, and
# assertion below is copied verbatim from the PC file so results are directly
# comparable. Judge-free: every assertion here is is-json/javascript, no
# llm-rubric anywhere in this suite, so no judge model or defaultTest
# override is needed on the Pi at all.
#
# Run on the Pi itself, against its own local Ollama (no OLLAMA_BASE_URL
# needed — this hits localhost:11434 by default):
#   npx promptfoo@latest eval -c promptfoo-extraction-pi.yaml -j 1
#
# -j 1 is not optional here the way it was flagged as a nice-to-have on the
# PC's GPU — this Pi is single-CPU-bound, so promptfoo's default -j 4 would
# have four generations actually contending for the same cores at once.

description: "Pi 5 extraction-model shortlist — structured JSON reliability"

providers:
  - id: ollama:chat:llama3.2:1b
    config:
      temperature: 0.0
      num_ctx: 4096
  - id: ollama:chat:qwen2.5:1.5b
    config:
      temperature: 0.0
      num_ctx: 4096
  - id: ollama:chat:gemma2:2b
    config:
      temperature: 0.0
      num_ctx: 4096
  - id: ollama:chat:llama3.2:3b
    config:
      temperature: 0.0
      num_ctx: 4096
  - id: ollama:chat:qwen2.5:3b
    config:
      temperature: 0.0
      num_ctx: 4096
  - id: ollama:chat:phi3.5:3.8b
    config:
      temperature: 0.0
      num_ctx: 4096

prompts:
  - |
    Return ONLY raw JSON, no markdown fences, no explanation.

    {{task}}

tests:
  - vars:
      task: |
        Extract fields into this exact JSON schema: {"name": string, "email": string, "company": string|null}

        Text: "Hey, this is Maria Chen from Bright Financial, you can reach me at m.chen@brightfin.example if you have questions about the invoice."
    assert:
      - type: is-json
      - type: javascript
        value: |
          const j = JSON.parse(output);
          return j.name === "Maria Chen" && j.email === "m.chen@brightfin.example" && j.company === "Bright Financial";

  - vars:
      task: |
        Classify the sentiment of this support ticket as exactly one of: "angry", "frustrated", "neutral", "satisfied". Return {"sentiment": "<one of those four>"}.

        Ticket: "This is the third time I've had to email about this. My card was charged twice for the same order and nobody has responded in four days."
    assert:
      - type: is-json
      - type: javascript
        value: |
          const j = JSON.parse(output);
          return ["angry", "frustrated"].includes(j.sentiment);

  - vars:
      task: |
        Extract this messy pasted table into JSON: {"rows": [{"item": string, "qty": number, "price": number}]}

        Item          Qty   Price
        Widget A       3    $12.50
        Gadget B      -     $99.00 (out of stock)
        Widget A       1     12.5
    assert:
      - type: is-json
      - type: javascript
        value: |
          const j = JSON.parse(output);
          return Array.isArray(j.rows) && j.rows.length === 3 && j.rows.every(r => typeof r.qty !== "undefined");
